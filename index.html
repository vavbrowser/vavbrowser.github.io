<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chrome</title>
    <link rel="icon" type="image/svg" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #202124;
        }
        
        /* Dark Chrome-style Top Bar */
        .chrome-bar {
            background-color: #2f3033;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #3c4043;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e8eaed;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #3c4043;
        }

        /* Dark Address Bar Container */
        .address-bar-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            background-color: #202124;
            border-radius: 100px;
            padding: 0 16px;
            height: 34px;
            border: 1px solid #3c4043;
        }
        .address-bar-container:focus-within {
            outline: 2px solid #8ab4f8;
        }

        /* Site Icon next to URL */
        .site-icon {
            color: #8ab4f8;
            margin-right: 8px;
            font-size: 14px;
        }

        /* Dark URL Input field */
        .address-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: #e8eaed;
        }

        /* Browser Content Window */
        .browser-content {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #202124;
        }
    </style>
</head>
<body>

    <div class="chrome-bar">
        <div class="nav-buttons">
            <button class="btn" title="Back">&#129144;</button>
            <button class="btn" title="Forward">&#129146;</button>
            <button class="btn" title="Reload" onclick="reloadPage()">&#8634;</button>
        </div>
        
        <div class="address-bar-container">
            <span class="site-icon">&#128274;</span> <input type="text" class="address-input" id="urlInput" value="https://www.google.com" onkeydown="handleNavigation(event)">
        </div>
    </div>

    <iframe id="browserFrame" class="browser-content" src="https://www.google.com/webhp?igu=1"></iframe>

    <script>
        const iframe = document.getElementById('browserFrame');
        const urlInput = document.getElementById('urlInput');

        function handleNavigation(event) {
            if (event.key === 'Enter') {
                let url = urlInput.value.trim();
                
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                
                urlInput.value = url;
                iframe.src = url;
            }
        }

        function reloadPage() {
            iframe.src = iframe.src;
        }
    </script>

</body>
</html>
