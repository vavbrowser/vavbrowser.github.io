<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Browser AI</title>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#17202e;--mute:#5b667a;--acc:#2f5bea;--line:#d5dbe6;--code:#0f1623;--codeink:#e3e9f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--panel:#1b212b;--ink:#e6eaf2;--mute:#97a2b8;--acc:#7ea2ff;--line:#2d3644;--code:#0a0e15}}
:root[data-theme="dark"]{--bg:#12161d;--panel:#1b212b;--ink:#e6eaf2;--mute:#97a2b8;--acc:#7ea2ff;--line:#2d3644;--code:#0a0e15}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:18px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px;flex:1 1 220px;min-width:0}
summary{cursor:pointer;font-size:14px;color:var(--acc);margin-top:8px}
select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px}
select{max-width:100%;flex:1 1 260px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:8px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.sm{font-size:12px;padding:3px 9px}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
progress{width:100%;height:6px;margin-top:8px;accent-color:var(--acc)}
#status{font-size:13px;color:var(--mute);margin-top:4px}
#chat{flex:1;overflow-y:auto;padding:16px;max-width:900px;width:100%;margin:0 auto}
.msg{margin-bottom:16px}
.who{font-size:13px;color:var(--mute);margin-bottom:2px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.code{background:var(--code);color:var(--codeink);border-radius:8px;margin:8px 0;overflow:hidden}
.code .h{display:flex;gap:6px;align-items:center;padding:4px 8px;font-size:12px;color:#9aa7c0;border-bottom:1px solid #26314a}
.code .h span{flex:1}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.run{padding:8px 12px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;border-top:1px solid #26314a;color:#b9f0c8}
iframe{width:100%;height:320px;border:0;background:#fff;display:block}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
form textarea{flex:1;height:52px;resize:none}
#warn{color:#c2410c;font-size:14px;margin-top:6px}
</style>
</head>
<body>
<header>
<h1>Browser AI</h1>
<div class="bar">
<select id="model" aria-label="Model"></select>
<label style="font-size:14px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="light" style="flex:none;padding:0"> Light models only (under 1.5 GB)</label>
<button id="load">Load model</button>
</div>
<details id="custom"><summary>Use a model that is not in the list</summary>
<div class="bar" style="margin-top:6px">
<input id="cid" placeholder="Model ID, e.g. gemma-3-1b-it-q4f16_1-MLC">
<input id="curl" placeholder="Model files URL (Hugging Face .../resolve/main/)">
<input id="clib" placeholder="Model library URL (.wasm file)">
</div>
<div id="note" style="font-size:13px;color:var(--mute);margin-top:4px">Fill all three to load a custom MLC model. Leave them empty to use the dropdown.</div>
</details>
<progress id="prog" value="0" max="1" hidden></progress>
<div id="status">Pick a model and press Load. The first load downloads it, and later loads use the browser cache.</div>
<div id="warn" hidden></div>
</header>

<div id="chat" aria-live="polite"></div>

<form id="form">
<textarea id="input" placeholder="Ask for code, e.g. write a JavaScript function that finds prime numbers" disabled></textarea>
<button id="send" disabled>Send</button>
<button id="stop" type="button" class="alt" hidden>Stop</button>
<button id="clear" type="button" class="alt">Clear</button>
</form>

<script type="module">
const $ = id => document.getElementById(id);
const SYSTEM = "You are an expert programmer. Answer with correct, complete, runnable code in fenced code blocks with a language tag, followed by a two or three sentence explanation. Prefer simple solutions. For web pages, give one self-contained HTML file.";
let webllm, engine, busy = false;
const CHAT = "You are a friendly, helpful assistant. Keep answers clear and concise.";
let currentId = "";
let history = [{role: "system", content: SYSTEM}];

if (!navigator.gpu) {
  $("warn").hidden = false;
  $("warn").textContent = "WebGPU is not available in this browser. Use a recent desktop Chrome or Edge, and open this page over https or localhost.";
}

try {
  webllm = await import("https://esm.run/@mlc-ai/web-llm");
  const all = webllm.prebuiltAppConfig.model_list;
  const ad = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
  const f16 = !!(ad && ad.features.has("shader-f16"));
  const fmt = f16 ? "q4f16" : "q4f32", q0 = f16 ? "q0f16" : "q0f32";
  const ok = m => m.model_id.includes(fmt) || (m.model_id.includes(q0) && (m.vram_required_MB || 0) < 1000);
  const byMem = (x, y) => (x.vram_required_MB || 0) - (y.vram_required_MB || 0);
  const opt = m => {
    const gb = m.vram_required_MB ? ` (about ${(m.vram_required_MB / 1024).toFixed(1)} GB GPU memory)` : "";
    return `<option value="${m.model_id}">${m.model_id.replace("-MLC", "")}${gb}</option>`;
  };
  const grp = (t, l) => l.length ? `<optgroup label="${t}">${l.sort(byMem).map(opt).join("")}</optgroup>` : "";
  const render = () => {
    const keep = m => ok(m) && (!$("light").checked || (m.vram_required_MB || 0) < 1500);
    const coders = all.filter(m => /coder/i.test(m.model_id) && keep(m));
    const chats = all.filter(m => !/coder|vision|math|embed|llava|deepseek|snowflake/i.test(m.model_id) && keep(m));
    $("model").innerHTML = grp("Coding models", coders) + grp("Chat models", chats) || all.map(opt).join("");
  };
  render();
  $("light").onchange = () => { render(); $("model").selectedIndex = 0; };
  if (![...$("model").options].some(o => /gemma-3/i.test(o.value))) $("note").textContent = "Gemma 3 is not in this version of WebLLM’s built-in list. To use it, fill all three fields with an MLC build and its matching library file.";
  const pick = [...$("model").options].find(o => /Coder-1\.5B/i.test(o.value));
  if (pick) pick.selected = true;
} catch (e) {
  $("status").textContent = "Could not load the WebLLM library. Check your connection and that this page is not running inside a sandbox.";
  $("load").disabled = true;
}

$("load").onclick = async () => {
  const cid = $("cid").value.trim(), curl = $("curl").value.trim(), clib = $("clib").value.trim();
  const custom = !!(cid && curl && clib), id = custom ? cid : $("model").value;
  const coder = /coder/i.test(id); currentId = id;
  history[0].content = coder ? SYSTEM : CHAT;
  $("input").placeholder = coder ? "Ask for code, e.g. write a JavaScript function that finds prime numbers" : "Message the model";
  $("load").disabled = true; $("prog").hidden = false;
  try {
    if (engine) { try { await engine.unload(); } catch (e) {} }
    const cfg = {initProgressCallback: p => { $("prog").value = p.progress; $("status").textContent = p.text; }};
    if (custom) {
      const base = webllm.prebuiltAppConfig;
      const entry = {model: curl.endsWith("/") ? curl : curl + "/", model_id: cid, model_lib: clib};
      if (/f16/i.test(cid)) entry.required_features = ["shader-f16"];
      cfg.appConfig = {...base, model_list: [...base.model_list, entry]};
    }
    engine = await webllm.CreateMLCEngine(id, cfg);
    $("status").textContent = "Ready. " + id.replace("-MLC", "");
    $("prog").hidden = true; $("input").disabled = false; $("send").disabled = false; $("input").focus();
  } catch (e) {
    $("status").textContent = "Load failed: " + e.message;
  }
  $("load").disabled = false;
};

function toolbar(label, fn) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "alt sm"; b.textContent = label; b.onclick = () => fn(b);
  return b;
}

function runJS(code, out) {
  out.textContent = "";
  const src = "console.log=console.error=console.warn=(...a)=>postMessage(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '));onmessage=e=>{try{(0,eval)(e.data)}catch(x){postMessage('Error: '+x.message)}postMessage(null)}";
  const w = new Worker(URL.createObjectURL(new Blob([src])));
  const t = setTimeout(() => { w.terminate(); out.textContent += "\nStopped after 5 seconds."; }, 5000);
  w.onmessage = e => { if (e.data === null) { clearTimeout(t); w.terminate(); if (!out.textContent) out.textContent = "(no output)"; } else out.textContent += e.data + "\n"; };
  w.postMessage(code);
}

function render(el, text) {
  el.textContent = "";
  let last = 0;
  const addText = s => { if (!s.trim()) return; const d = document.createElement("div"); d.className = "txt"; d.textContent = s.trim(); el.append(d); };
  for (const m of text.matchAll(/```([\w+-]*)\n?([\s\S]*?)(?:```|$)/g)) {
    addText(text.slice(last, m.index)); last = m.index + m[0].length;
    const lang = m[1].toLowerCase(), code = m[2].replace(/\n$/, "");
    const box = document.createElement("div"); box.className = "code";
    const h = document.createElement("div"); h.className = "h";
    const l = document.createElement("span"); l.textContent = lang || "code"; h.append(l);
    const pre = document.createElement("pre"); pre.textContent = code;
    const extra = document.createElement("div");
    h.append(toolbar("Copy", async b => { try { await navigator.clipboard.writeText(code); b.textContent = "Copied"; } catch (e) { b.textContent = "Select text"; } setTimeout(() => b.textContent = "Copy", 1500); }));
    if (!busy && /^(js|javascript)$/.test(lang)) h.append(toolbar("Run", () => { extra.innerHTML = ""; const o = document.createElement("div"); o.className = "run"; extra.append(o); runJS(code, o); }));
    if (!busy && lang === "html") h.append(toolbar("Preview", () => { extra.innerHTML = ""; const f = document.createElement("iframe"); f.sandbox = "allow-scripts"; f.srcdoc = code; extra.append(f); }));
    box.append(h, pre, extra); el.append(box);
  }
  addText(text.slice(last));
}

function addMsg(who) {
  const d = document.createElement("div"); d.className = "msg";
  const w = document.createElement("div"); w.className = "who"; w.textContent = who;
  const body = document.createElement("div"); d.append(w, body); $("chat").append(d);
  return body;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const q = $("input").value.trim();
  if (!q || busy || !engine) return;
  $("input").value = ""; history.push({role: "user", content: q});
  addMsg("You").textContent = q;
  const body = addMsg("AI"); let text = "", queued = false;
  busy = true; $("send").hidden = true; $("stop").hidden = false;
  try {
    const stream = await engine.chat.completions.create({messages: [history[0], ...history.slice(1).slice(-7)], ...(/qwen3/i.test(currentId) ? {extra_body: {enable_thinking: false}} : {}), stream: true, stream_options: {include_usage: true}, temperature: 0.2, max_tokens: 1024});
    for await (const c of stream) {
      text += c.choices[0]?.delta?.content || ""; const tps = c.usage?.extra?.decode_tokens_per_s; if (tps) $("status").textContent = "Speed: " + tps.toFixed(1) + " tokens per second";
      if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; render(body, text); $("chat").scrollTop = 1e9; }); }
    }
  } catch (err) { text += "\n\nError: " + err.message; }
  busy = false; $("send").hidden = false; $("stop").hidden = true;
  history.push({role: "assistant", content: text}); render(body, text); $("chat").scrollTop = 1e9;
};
$("stop").onclick = () => engine && engine.interruptGenerate();
$("clear").onclick = () => { history = [{role: "system", content: SYSTEM}]; $("chat").textContent = ""; };
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
</script>
</body>
</html>
