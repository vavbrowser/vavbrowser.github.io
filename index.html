<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12343b">
<title>Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--ink:#12343b;--paper:#f3efe6;--card:#fffdf8;--mine:#12343b;--mine-t:#f3efe6;--accent:#e08e2b;--mute:#6b7b7e;--line:#ddd6c6}
@media(prefers-color-scheme:dark){:root{--ink:#e8e4d8;--paper:#0e1f23;--card:#17292e;--mine:#e08e2b;--mine-t:#1b1203;--accent:#e08e2b;--mute:#8fa1a4;--line:#27393e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 Georgia,"Iowan Old Style",serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
header h1{font-size:1.15rem;margin:0;flex:1}
header small{display:block;font:.75rem system-ui,sans-serif;color:var(--mute)}
button,input{font:inherit;color:inherit}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;font:.85rem system-ui,sans-serif;cursor:pointer}
#banner{display:none;background:var(--accent);color:#1b1203;font:.85rem system-ui,sans-serif;padding:.4rem 1rem;text-align:center}
#list{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.35rem}
.msg{max-width:80%;padding:.5rem .8rem;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--mine);color:var(--mine-t);border-color:transparent}
.msg .who{display:block;font:600 .72rem system-ui,sans-serif;color:var(--accent);margin-bottom:.1rem}
.msg time{display:block;font:.68rem system-ui,sans-serif;opacity:.6;margin-top:.15rem;text-align:right}
.empty{margin:auto;color:var(--mute);text-align:center}
form{display:flex;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--line)}
form input{flex:1;min-width:0;padding:.65rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--card)}
form button{border:0;border-radius:999px;background:var(--accent);color:#1b1203;font-weight:700;padding:0 1.2rem;cursor:pointer}
form button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:22rem;width:calc(100% - 2rem)}
dialog::backdrop{background:#0008}
dialog label{display:block;font:.8rem system-ui,sans-serif;color:var(--mute);margin:.7rem 0 .25rem}
dialog input{width:100%;padding:.55rem .7rem;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
dialog menu{display:flex;justify-content:flex-end;gap:.5rem;margin:1rem 0 0;padding:0}
#setup{display:none;margin:auto;max-width:28rem;padding:1.5rem}
#setup code{background:var(--card);padding:.1rem .3rem;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1 id="title">Chat<small id="status">Connecting…</small></h1>
  <button class="ghost" id="settingsBtn">Settings</button>
</header>
<div id="banner">You’re offline. Messages will send when you reconnect.</div>
<div id="setup">
  <h2>Add your Firebase config</h2>
  <p>Open <code>index.html</code> and paste your web app’s config into <code>firebaseConfig</code>. The README lists the steps and the database rules to use.</p>
</div>
<main id="list" aria-live="polite"></main>
<form id="form" autocomplete="off">
  <input id="text" maxlength="500" placeholder="Write a message" aria-label="Message" required>
  <button id="send" type="submit">Send</button>
</form>

<dialog id="dlg">
  <form method="dialog" id="dlgForm" style="display:block;border:0;padding:1rem">
    <strong>Your chat settings</strong>
    <label for="nameIn">Display name</label>
    <input id="nameIn" maxlength="24" required>
    <label for="roomIn">Room</label>
    <input id="roomIn" maxlength="30" required>
    <menu><button class="ghost" value="cancel" formnovalidate>Cancel</button><button class="ghost" value="ok" id="saveBtn">Save</button></menu>
  </form>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, push, query, limitToLast, onChildAdded, off, serverTimestamp, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// 1. Paste your Firebase web app config here (Project settings → Your apps).
const firebaseConfig = {
  apiKey: "AIzaSyDwDe910zdnwDi8Cns-AFkCMZbxXzddJuA",
  authDomain: "server-bc966.firebaseapp.com",
  databaseURL: "https://server-bc966-default-rtdb.firebaseio.com",
  projectId: "server-bc966",
  storageBucket: "server-bc966.firebasestorage.app",
  messagingSenderId: "658451047484",
  appId: "1:658451047484:web:38d3fa3cd5b969b9d6cf39",
  measurementId: "G-G9C9095FEH"
};

const $ = id => document.getElementById(id);
const list = $("list"), statusEl = $("status");
let name = localStorage.getItem("chat:name") || "";
let room = localStorage.getItem("chat:room") || "general";
let uid = null, db = null, feed = null;

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const syncOnline = () => $("banner").style.display = navigator.onLine ? "none" : "block";
addEventListener("online", syncOnline); addEventListener("offline", syncOnline); syncOnline();

if (firebaseConfig.apiKey === "YOUR_API_KEY") {
  $("setup").style.display = "block"; list.style.display = "none"; $("form").style.display = "none";
  statusEl.textContent = "Not configured";
} else start();

async function start() {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  try {
    const cred = await signInAnonymously(getAuth(app));
    uid = cred.user.uid;
  } catch (e) {
    statusEl.textContent = "Sign-in failed. Enable Anonymous auth in Firebase.";
    return;
  }
  onValue(ref(db, ".info/connected"), s => { statusEl.textContent = (s.val() ? "Online" : "Reconnecting…") + " · #" + room; });
  if (!name) openSettings(); else joinRoom();
}

function joinRoom() {
  if (feed) off(feed);
  list.replaceChildren();
  showEmpty();
  $("title").firstChild.textContent = "#" + room;
  const base = ref(db, `rooms/${room}/messages`);
  feed = query(base, limitToLast(100));
  onChildAdded(feed, snap => addMessage(snap.val()));
}

function showEmpty() {
  const p = document.createElement("p");
  p.className = "empty"; p.id = "empty"; p.textContent = "No messages yet. Say hello.";
  list.append(p);
}

function addMessage(m) {
  $("empty")?.remove();
  const near = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  const el = document.createElement("div");
  el.className = "msg" + (m.uid === uid ? " me" : "");
  if (m.uid !== uid) { const w = document.createElement("span"); w.className = "who"; w.textContent = m.name; el.append(w); }
  el.append(document.createTextNode(m.text));
  const t = document.createElement("time");
  t.textContent = m.ts ? new Date(m.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  el.append(t);
  list.append(el);
  if (near || m.uid === uid) list.scrollTop = list.scrollHeight;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !uid) return;
  $("text").value = "";
  push(ref(db, `rooms/${room}/messages`), { uid, name, text, ts: serverTimestamp() });
});

function openSettings() {
  $("nameIn").value = name; $("roomIn").value = room;
  $("dlg").showModal();
}
$("settingsBtn").onclick = () => db ? openSettings() : null;
$("dlg").addEventListener("close", () => {
  if ($("dlg").returnValue !== "ok") { if (!name) openSettings(); return; }
  const n = $("nameIn").value.trim().slice(0, 24);
  const r = $("roomIn").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "-").slice(0, 30);
  if (!n || !r) return openSettings();
  name = n; room = r;
  localStorage.setItem("chat:name", name); localStorage.setItem("chat:room", room);
  joinRoom();
});
</script>
</body>
</html>
